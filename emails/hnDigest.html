<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title></title>
    <style type="text/css" rel="stylesheet" media="all">
      :root {
        color-scheme: light dark;
        supported-color-schemes: light dark;
      }

      body {
        width: 100% !important;
        height: 100%;
        margin: 0;
        background-color: #fff;
        color: #050505;
        -webkit-text-size-adjust: none;
      }

      table {
        border-collapse: collapse;
      }

      td {
        word-break: break-word;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif,
          "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      }

      a {
        color: #007aff;
        text-decoration: none;
      }

      .email-wrapper {
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #fff;
      }

      .email-content {
        width: 100%;
        max-width: 570px;
        margin: 0 auto;
        padding: 0;
        background-color: #fff;
      }

      .header-cell {
        padding: 32px 16px 0;
      }

      .digest-title {
        margin: 0;
        color: #050505;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.25;
        text-align: left;
      }

      .digest-date {
        margin: 8px 0 0;
        color: #686b78;
        font-size: 16px;
        line-height: 1.5;
      }

      .post-cell {
        padding: 16px 16px 0;
      }

      .post-title {
        color: #007aff;
        font-size: 16px;
        font-weight: 500;
        line-height: 1.5;
      }

      .post-meta {
        padding-top: 4px;
        color: #686b78;
        font-size: 14px;
        line-height: 1.5;
      }

      .gray-link {
        color: #686b78;
        text-decoration: none;
      }

      .email-footer {
        padding: 32px 16px;
        color: #686b78;
        font-size: 14px;
        line-height: 1.5;
      }

      .email-footer a {
        color: #007aff;
      }

      @media only screen and (max-width: 600px) {
        .email-content {
          width: 100% !important;
        }
      }

      @media (prefers-color-scheme: dark) {
        body,
        .email-wrapper,
        .email-content {
          background-color: #050505 !important;
          color: #fff !important;
        }

        .digest-title,
        .post-title {
          color: #fff !important;
        }

        .digest-date,
        .post-meta,
        .gray-link,
        .email-footer {
          color: #9094a6 !important;
        }

        a,
        .post-title a,
        .email-footer a {
          color: #ff9500 !important;
        }
      }
    </style>
    <!--[if mso]>
      <style type="text/css">
        .f-fallback {
          font-family: Arial, sans-serif;
        }
      </style>
    <![endif]-->
  </head>
  <body>
    <table class="email-wrapper" width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr>
        <td align="center">
          <table
            class="email-content"
            width="570"
            cellpadding="0"
            cellspacing="0"
            role="presentation"
          >
            <tr>
              <td class="header-cell">
                <div class="f-fallback">
                  <h1 class="digest-title">Hacker News Digest</h1>
                  <p class="digest-date">{{ date }}</p>
                </div>
              </td>
            </tr>
            {{#each posts}}
            <tr>
              <td class="post-cell">
                <div class="post-title">
                  <a href="{{ url }}">{{ title }}</a>
                </div>
                <div class="post-meta">
                  <a class="gray-link" href="{{ url }}">{{ domain }}</a>{{#domain}} / {{/domain}}<a
                    class="gray-link"
                    href="https://brianlovin.com/hn/{{ id }}"
                    >{{ comments_count }} comments</a
                  >
                </div>
              </td>
            </tr>
            {{/each}}
            <tr>
              <td class="email-footer">
                <div class="f-fallback">
                  You are receiving this email because you subscribed at
                  <a href="https://brianlovin.com/hn">brianlovin.com/hn</a>
                  <br />
                  <a href="{{ unsubscribe_url }}">Unsubscribe</a>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
