name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decision:
    runs-on: ubuntu-latest
    outputs:
      local_verified: ${{ steps.receipt.outputs.local_verified || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check trusted Mac verification
        id: receipt
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LOCAL_CI_PUBLIC_KEY: ${{ vars.BRIOS_LOCAL_CI_PUBLIC_KEY }}
        run: |
          trusted="$RUNNER_TEMP/brios-ci-trusted"
          mkdir -p "$trusted"
          if git show "$PR_BASE_SHA:scripts/ci/check-receipt.mjs" > "$trusted/check-receipt.mjs" &&
             git show "$PR_BASE_SHA:scripts/ci/receipt.mjs" > "$trusted/receipt.mjs"; then
            if ! node "$trusted/check-receipt.mjs"; then
              echo "local_verified=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Trusted verifier not installed on base yet; using remote CI."
            echo "local_verified=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: decision
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate decision
        env:
          DECISION_RESULT: ${{ needs.decision.result }}
          LOCAL_VERIFIED: ${{ needs.decision.outputs.local_verified }}
        run: |
          if [ "$DECISION_RESULT" != success ] || { [ "$LOCAL_VERIFIED" != true ] && [ "$LOCAL_VERIFIED" != false ]; }; then
            echo "Verification decision failed or is incomplete."
            exit 1
          fi
      - name: Accept signed local verification
        if: needs.decision.outputs.local_verified == 'true'
        run: echo "The trusted Mac passed lint, tests, and build for this exact PR head and base."
      - uses: actions/checkout@v4
        if: needs.decision.outputs.local_verified != 'true'
      - uses: actions/setup-node@v4
        if: needs.decision.outputs.local_verified != 'true'
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        if: needs.decision.outputs.local_verified != 'true'
        with:
          bun-version: "1.3.3"
      - name: Install locked dependencies
        if: needs.decision.outputs.local_verified != 'true'
        run: bun install --frozen-lockfile
      - name: Verify lint, tests, and production build
        if: needs.decision.outputs.local_verified != 'true'
        run: bun run ci:all
