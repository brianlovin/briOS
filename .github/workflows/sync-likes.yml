name: sync likes to notion

on:
  schedule:
    - cron: "0 * * * *" # Every hour
  workflow_dispatch:

# The job only calls the site; it needs no GITHUB_TOKEN scopes.
permissions: {}

jobs:
  sync-likes:
    runs-on: ubuntu-latest
    steps:
      - name: sync likes to notion
        env:
          LIKES_SYNC_TOKEN: ${{ secrets.LIKES_SYNC_TOKEN }}
        # Send the token as a header so it is not recorded in URL request logs.
        # Block scalar: an inline value containing "Authorization: " is invalid YAML.
        run: |
          curl --fail-with-body -H "Authorization: Bearer $LIKES_SYNC_TOKEN" "https://brianlovin.com/api/likes/sync"
