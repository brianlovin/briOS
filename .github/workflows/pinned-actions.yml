name: Pinned actions

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "scripts/ci/check-pinned-actions*.mjs"
  pull_request:
    paths:
      - ".github/**"
      - "scripts/ci/check-pinned-actions*.mjs"

permissions:
  contents: read

jobs:
  pinned-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every action to be pinned to a commit SHA
        run: node scripts/ci/check-pinned-actions.mjs
